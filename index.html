    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }

        .text-balance { text-wrap: balance; }

        @keyframes hueCycle { 0% { filter: hue-rotate(0deg) saturate(1.1); } 50% { filter: hue-rotate(180deg) saturate(1.2); } 100% { filter: hue-rotate(360deg) saturate(1.1); } }
        @keyframes gradientPulse { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .quote-wrapper { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .quote-slide { position: absolute; width: 100%; opacity: 0; transform: scale(0.95) translateY(20px); pointer-events: none; transition: opacity 1.4s ease-in-out, transform 1.4s ease-in-out; will-change: opacity, transform; }
        .quote-slide.active { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; z-index: 10; }
        .quote-slide .quote-author { opacity: 0; transform: translateY(8px); transition: opacity 1.4s ease-out, transform 1.4s ease-out; transition-delay: 300ms; }
        .quote-slide.active .quote-author { opacity: 1; transform: translateY(0); }
        
        .progress-ring__circle { transition: stroke-dashoffset 0.1s linear; transform: rotate(-90deg); transform-origin: 50% 50%; }

        /* REFINED TRAY ARCHITECTURE */
        #detail-view { height: 56px; transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease; overflow: hidden; display: flex; flex-direction: column; }
        #detail-view.detail-expanded { height: 85vh; }
        #detail-view.synopsis-mode { height: 0; opacity: 0; margin-top: 0; border: none; pointer-events: none; }
        .detail-fixed-header { flex-shrink: 0; }
        .detail-scroll-area { flex-grow: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

        /* FLIP SYSTEM */
        .scene { perspective: 2000px; width: 100%; position: relative; min-height: 420px; z-index: 20; transition: min-height 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .scene.expanded-scene { min-height: 85vh; }
        .flip-container { position: relative; width: 100%; height: 100%; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
        .is-flipped { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; top: 0; left: 0; border-radius: 1rem 1rem 0 0; overflow: hidden; }
        .card-front { z-index: 2; position: relative; border-radius: 1rem 1rem 0 0; }
        .card-back { transform: rotateY(180deg); z-index: 1; display: flex; flex-direction: column; background: white; border: 1px solid #e5e7eb; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); border-radius: 1rem; }

        /* CUSTOM SCROLLBAR FOR CONTENT AREA */
        .content-scroll::-webkit-scrollbar { width: 6px; }
        .content-scroll::-webkit-scrollbar-track { background: transparent; }
        .content-scroll::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
        .content-scroll::-webkit-scrollbar-thumb:hover { background: #d1d5db; }
        .content-scroll { scrollbar-width: thin; scrollbar-color: #e5e7eb transparent; overflow-y: auto !important; -webkit-overflow-scrolling: touch; position: relative; z-index: 40; }

        summary::-webkit-details-marker { display: none !important; }
        summary::marker { content: "" !important; display: none !important; }
        details > summary { list-style: none !important; }
        .category-tile[open] .category-chevron { transform: rotate(180deg); }

        function closeAuthModal() {
            document.getElementById('login-modal').classList.add('hidden');
        }

        async function triggerOwnerAuth() {
            document.getElementById('login-modal').classList.remove('hidden');
            document.getElementById('auth-email').focus();
        }

        // Initialize Session and Listeners
        window.addEventListener('load', async () => {
            // Restore Guest Session initially
            const localData = localStorage.getItem('mjh_saved_guest');
            savedItems = localData ? new Set(JSON.parse(localData)) : new Set();
            updateSavedUI();

            // Check for existing session
            const { data: { session } } = await window.supabaseClient.auth.getSession();
            if (session) {
                setOwnerState(true);
                await syncLibrary();
            }

            // Listen for auth changes
            window.supabaseClient.auth.onAuthStateChange(async (event, session) => {
                if (event === 'SIGNED_IN') {
                    setOwnerState(true);
                    await syncLibrary();
                } else if (event === 'SIGNED_OUT') {
                    setOwnerState(false);
                }
            });

            buildQuoteQueue();
            startRotator();
            renderLibrary();
            updateActiveContextCount();
        });

        function setOwnerState(active) {
            window.isOwner = active;
            if (active) {
                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('owner-status').classList.remove('hidden');
            } else {
                document.getElementById('login-btn').classList.remove('hidden');
                document.getElementById('owner-status').classList.add('hidden');
                // Restore Guest Session from LocalStorage
                const localData = localStorage.getItem('mjh_saved_guest');
                savedItems = localData ? new Set(JSON.parse(localData)) : new Set();
                updateSavedUI();
            }
        }

        async function handleSignOut() {
            const { error } = await window.supabaseClient.auth.signOut();
            if (!error) {
                showToast("Signed Out");
                location.reload(); 
            }
        }

        async function handleLoginSubmit() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            
            if (email && password) {
                const { data, error } = await window.supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    showToast("Auth Failed: " + error.message);
                } else {
                    setOwnerState(true);
                    closeAuthModal();
                    document.getElementById('library-search').value = '';
                    handleSearch(''); 
                    showToast("Ka Sync Active");
                    await syncLibrary();
                }
            }
        }

        async function syncLibrary() {
            savedItems = new Set();
            if (window.isOwner) {
                const { data, error } = await window.supabaseClient.from('saved_items').select('book_id');
                if (!error && data) {
                    data.forEach(item => savedItems.add(item.book_id));
                }
            } else {
                const localData = localStorage.getItem('mjh_saved_guest');
                if (localData) {
                    const parsed = JSON.parse(localData);
                    parsed.forEach(id => savedItems.add(id));
                }
            }
            updateSavedUI();
        }

        async function toggleSavePersistence(bookId) {
            if (window.isOwner) {
                const { data: { user } } = await window.supabaseClient.auth.getUser();
                if (savedItems.has(bookId)) {
                    await window.supabaseClient.from('saved_items').delete().eq('book_id', bookId).eq('user_id', user.id);
                    savedItems.delete(bookId);
                } else {
                    await window.supabaseClient.from('saved_items').insert([{ book_id: bookId, user_id: user.id }]);
                    savedItems.add(bookId);
                }
            } else {
                if (savedItems.has(bookId)) savedItems.delete(bookId);
                else savedItems.add(bookId);
                localStorage.setItem('mjh_saved_guest', JSON.stringify([...savedItems]));
            }
            updateSavedUI();
        }

        function updateSavedUI() {
            document.getElementById('saved-count').textContent = `(${savedItems.size})`;
            if (activeFilter === 'favorites') renderLibrary();
            buildQuoteQueue(); // Sync rotator with new saves
        }

        function setFilter(type) {
            activeFilter = type;
            const libBtn = document.getElementById('filter-all');
            const favBtn = document.getElementById('filter-favorites');
            
            if (type === 'all') {
                libBtn.className = "flex-1 py-1.5 text-[10px] font-bold uppercase rounded-md bg-gray-900 text-white shadow-sm transition-all flex items-center justify-center gap-2";
                favBtn.className = "flex-1 py-1.5 text-[10px] font-medium uppercase rounded-md text-gray-500 hover:text-gray-900 hover:bg-gray-200/50 transition-all flex items-center justify-center gap-2";
            } else {
                favBtn.className = "flex-1 py-1.5 text-[10px] font-bold uppercase rounded-md bg-gray-900 text-white shadow-sm transition-all flex items-center justify-center gap-2";
                libBtn.className = "flex-1 py-1.5 text-[10px] font-medium uppercase rounded-md text-gray-500 hover:text-gray-900 hover:bg-gray-200/50 transition-all flex items-center justify-center gap-2";
            }
            renderLibrary();
        }

                return matchesSearch && matchesTopic && matchesFilter;
            });

                        <li><span class="font-bold">The Genealogy of Ideas:</span> Everything is a mashup. You are a sum of your influences. The artist is a collector.</li>
                    </ul>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">2. Don't Wait Until You Know Who You Are</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">Start Making:</span> You figure out who you are by making things. Fake it 'til you make it.</li>
                        <li><span class="font-bold">Copy Your Heroes:</span> We learn by copying. But don't just copy the style; copy the thinking behind the style.</li>
                    </ul>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">3. Use Your Hands</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">Analog vs. Digital:</span> Computers are good for editing, but bad for generating ideas. Step away from the screen.</li>
                        <li><span class="font-bold">The Body:</span> Creativity is a kinetic act. Move your body to move your brain.</li>
                    </ul>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">4. Side Projects and Hobbies</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">Productive Procrastination:</span> The work you do when you're procrastinating is often the work you should be doing for the rest of your life.</li>
                        <li><span class="font-bold">Don't Throw Anything Away:</span> Keep a "swipe file" of everything that inspires you.</li>
                    </ul>
                </div>
            </div>
        `,quotes:[
            {text:"Start copying what you love. Copy copy copy copy. At the end of the copy you will find your self.",context:"Imitation is the first step to innovation. By reverse-engineering what resonates, you find your own voice."},
            {text:"Draw the art you want to see, start the business you want to run, play the music you want to hear, write the books you want to read, build the products you want to use.",context:"The audience of one: Make what you wish existed. It's the only way to guarantee passion."},
            {text:"Creativity is subtraction.",context:"Constraints breed creativity. It's not about what you include, it's about what you leave out."},
            {text:"You are a mashup of what you let into your life.",context:"Curate your inputs. Your output is a direct reflection of your information diet."},
            {text:"Be boring. It's the only way to get work done.",context:"Routine protects creative energy. Save your wildness for the page, not your life."}
        ]},
        {id:13,title:"Big Magic",author:"Elizabeth Gilbert",category:"Creativity",synopsis:`
            <div class="flex flex-col gap-8 text-[13px] leading-relaxed text-gray-700 max-w-3xl mx-auto py-4">
                <div class="space-y-1">
                    <h2 class="font-bold text-gray-900 text-base">Creative Living Without Fear</h2>
                    <p>Creativity is a relationship between a human being and the mysteries of inspiration. It is not a burden or a torture; it is a gift and a game.</p>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">1. Courage</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">Fear is Boring:</span> Fear is the oldest, most unoriginal part of you. Creativity is the newest, most interesting part.</li>
                        <li><span class="font-bold">The Deal:</span> You can't get rid of fear, but you can refuse to let it drive. "Fear, you can come along, but you're sitting in the back seat."</li>
                    </ul>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">2. Enchantment</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">Ideas are Alive:</span> Ideas are disembodied energy forms looking for a human partner. If you say no, they move on to someone else.</li>
                        <li><span class="font-bold">The Muse:</span> Inspiration comes and goes. You have to be working when it shows up.</li>
                    </ul>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">3. Permission</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">You Don't Need It:</span> You don't need a degree or approval to be creative. You have a birthright to make things.</li>
                        <li><span class="font-bold">Authenticity:</span> Stop trying to be "important" or "profound." Just be true.</li>
                    </ul>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">4. Persistence</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">The Affair:</span> Treat your creativity like a secret affair. Steal time for it. Keep it exciting.</li>
                        <li><span class="font-bold">Done is Better Than Good:</span> Perfectionism is just fear in fancy shoes. Release your work into the wild.</li>
                    </ul>
                </div>
            </div>
        `,quotes:[
            {text:"The universe buries strange jewels deep within us all, and then stands back to see if we can find them.",context:"Creativity as a treasure hunt. The joy is in the seeking and the uncovering."},
            {text:"Perfectionism is just fear in fancy shoes and a mink coat.",context:"Don't let the need to be perfect stop you from being done. Imperfect action beats perfect inaction."},
            {text:"A creative life is an amplified life. It's a bigger life, a happier life, an expanded life, and a hell of a lot more interesting life.",context:"The goal isn't money or fame; it's vitality. Creativity is the engine of a well-lived life."},
            {text:"You can measure your worth by your dedication to your path, not by your successes or failures.",context:"Process over outcome. Your commitment to the work is the only metric you control."},
            {text:"Done is better than good.",context:"Shipping is a skill. Release the work so you can move on to the next discovery."}
        ]},
        {id:14,title:"The Design of Everyday Things",author:"Don Norman",category:"Design",synopsis:`
            <div class="flex flex-col gap-8 text-[13px] leading-relaxed text-gray-700 max-w-3xl mx-auto py-4">
                <div class="space-y-1">
                    <h2 class="font-bold text-gray-900 text-base">Human-Centered Design</h2>
                    <p>Good design is actually a lot harder to notice than poor design, in part because good designs fit our needs so well that the design is invisible.</p>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">1. Two Most Important Characteristics</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">Discoverability:</span> Is it possible to even figure out what actions are possible and where and how to perform them?</li>
                        <li><span class="font-bold">Understanding:</span> What does it all mean? How is the product supposed to be used?</li>
                    </ul>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">2. Fundamental Principles of Interaction</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">Affordances:</span> The relationship between a physical object and a person (e.g., a chair affords sitting).</li>
                        <li><span class="font-bold">Signifiers:</span> Signals that tell you where the action should take place (e.g., a "Push" sign on a door).</li>
                        <li><span class="font-bold">Mapping:</span> The relationship between controls and their effects (e.g., steering wheel turns car left/right).</li>
                        <li><span class="font-bold">Feedback:</span> Sending back information about what action has been done and what has been accomplished.</li>
                    </ul>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">3. The Gulf of Execution and Evaluation</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">Gulf of Execution:</span> How do I work this? (Bridge it with Signifiers, Constraints, Mappings).</li>
                        <li><span class="font-bold">Gulf of Evaluation:</span> What happened? (Bridge it with Feedback and a Conceptual Model).</li>
                    </ul>
                </div>
            </div>
        `,quotes:[
            {text:"Good design is actually a lot harder to notice than poor design, in part because good designs fit our needs so well that the design is invisible.",context:"Invisibility is the goal. The best systems recede into the background, leaving only the user's intent."},
            {text:"Two of the most important characteristics of good design are discoverability and understanding.",context:"Clarity first. If the user has to guess, the design has failed."},
            {text:"It is the duty of machines and those who design them to understand people.",context:"Empathy is a technical skill. You must understand the user's mental model to build effective tools."},
            {text:"Feedback is critical. It must be immediate and informative.",context:"The feedback loop: Without immediate response, the user feels lost and powerless."},
            {text:"Design is really an act of communication, which means having a deep understanding of the person with whom the designer is communicating.",context:"Design is language. Every button, label, and layout choice is a sentence in a conversation with the user."}
        ]},
        {id:15,title:"Flow",author:"Mihaly Csikszentmihalyi",category:"Focus",synopsis:`
            <div class="flex flex-col gap-8 text-[13px] leading-relaxed text-gray-700 max-w-3xl mx-auto py-4">
                <div class="space-y-1">
                    <h2 class="font-bold text-gray-900 text-base">The Psychology of Optimal Experience</h2>
                    <p>Flow is the state in which people are so involved in an activity that nothing else seems to matter; the experience itself is so enjoyable that people will do it even at great cost, for the sheer sake of doing it.</p>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">1. Components of Flow</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">Clear Goals:</span> Knowing exactly what needs to be done.</li>
                        <li><span class="font-bold">Immediate Feedback:</span> Knowing how well you are doing.</li>
                        <li><span class="font-bold">Balance:</span> A balance between the challenge of the task and the skill of the performer. (Too hard = Anxiety; Too easy = Boredom).</li>
                    </ul>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">2. The Autotelic Personality</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">Definition:</span> A person who generally does things for their own sake, rather than in order to achieve some later external goal.</li>
                        <li><span class="font-bold">Benefit:</span> They are less dependent on external rewards and more resilient to chaos.</li>
                    </ul>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">3. Order in Consciousness</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">Entropy:</span> The normal state of the mind is chaos (psychic entropy).</li>
                        <li><span class="font-bold">Negentropy:</span> Flow creates order. It organizes the self and builds complexity.</li>
                    </ul>
                </div>
            </div>
        `,quotes:[
            {text:"The best moments in our lives are not the passive, receptive, relaxing times... The best moments usually occur if a person's body or mind is stretched to its limits in a voluntary effort to accomplish something difficult and worthwhile.",context:"Happiness is active, not passive. It comes from the struggle, not the victory."},
            {text:"Control of consciousness determines the quality of life.",context:"Attention is the most valuable resource. Where you direct your focus determines your reality."},
            {text:"It is when we act freely, for the sake of the action itself rather than for ulterior motives, that we learn to become more than what we were.",context:"Intrinsic motivation: The activity itself must be the reward."},
            {text:"To overcome the anxieties and depressions of contemporary life, individuals must become independent of the social environment to the degree that they no longer respond exclusively in terms of its rewards and punishments.",context:"Autonomy: Break free from the stimulus-response loop of societal approval."},
            {text:"Flow is the state in which people are so involved in an activity that nothing else seems to matter.",context:"Deep engagement: The dissolution of the ego in the service of the task."}
        ]},
        {id:16,title:"Creativity, Inc.",author:"Ed Catmull",category:"Creativity",synopsis:`
            <div class="flex flex-col gap-8 text-[13px] leading-relaxed text-gray-700 max-w-3xl mx-auto py-4">
                <div class="space-y-1">
                    <h2 class="font-bold text-gray-900 text-base">Overcoming the Unseen Forces</h2>
                    <p>Creativity, Inc. is a manual for anyone who strives for originality and the first-ever trip into the nerve center of Pixar Animation. It is a book about how to build a creative culture.</p>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">1. The Braintrust</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">The Concept:</span> A group of smart, passionate people who are tasked with giving candid feedback.</li>
                        <li><span class="font-bold">The Rule:</span> No authority. The director does not have to follow the notes. This removes the defensive posture.</li>
                        <li><span class="font-bold">The Goal:</span> To push the project from "suck" to "not suck."</li>
                    </ul>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">2. Failure and Fear</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">Rebranding Failure:</span> Failure is not a necessary evil; it is a necessary consequence of doing something new.</li>
                        <li><span class="font-bold">Fail Fast:</span> The goal is to uncouple fear and failure. Make it safe to be wrong.</li>
                    </ul>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">3. The Beast</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">Feeding the Beast:</span> The pressure to keep the production line moving can kill creativity. You must protect the "ugly babies" (new ideas) from the "hungry beast" (the business needs).</li>
                    </ul>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">4. Honesty and Candor</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">Candor vs. Honesty:</span> Honesty is moral; Candor is just "telling it like it is." A creative culture requires absolute candor.</li>
                        <li><span class="font-bold">Notes Day:</span> A day where the entire company stops working to discuss how to fix the company.</li>
                    </ul>
                </div>
            </div>
        `,quotes:[
            {text:"If you give a good idea to a mediocre team, they will screw it up. If you give a mediocre idea to a brilliant team, they will either fix it or throw it away and come up with something better.",context:"People > Ideas. Invest in the team's capacity to solve problems, not just the specific solution."},
            {text:"Failure isn't a necessary evil. In fact, it isn't evil at all. It is a necessary consequence of doing something new.",context:"De-stigmatize failure. It is the tuition you pay for innovation."},
            {text:"Don't wait for things to be perfect before you share them with others. Show early and show often.",context:"Feedback loops: The longer you wait to show your work, the more attached you become, and the harder it is to fix."},
            {text:"The cost of preventing errors is often far greater than the cost of fixing them.",context:"Agility: Don't build a fortress against mistakes; build a hospital to heal them quickly."},
            {text:"It is not the manager's job to prevent risks. It is the manager's job to make it safe for others to take them.",context:"Psychological safety: The leader's role is to absorb the fear so the team can focus on the work."}
        ]},
        {id:17,title:"Outlive",author:"Peter Attia",category:"Health",synopsis:`
            <div class="flex flex-col gap-8 text-[13px] leading-relaxed text-gray-700 max-w-3xl mx-auto py-4">
                <div class="space-y-1">
                    <h2 class="font-bold text-gray-900 text-base">The Science of Longevity</h2>
                    <p>Move from Medicine 2.0 (treating disease after it appears) to Medicine 3.0 (prevention and personalization). The goal is not just a longer lifespan, but a longer "healthspan"—the period of life spent in good health.</p>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">1. The Four Horsemen</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">The Killers:</span> Heart disease, cancer, neurodegenerative disease, and type 2 diabetes (and related metabolic dysfunction).</li>
                        <li><span class="font-bold">Strategy:</span> These diseases are slow-moving. You must intervene decades before they manifest clinically.</li>
                    </ul>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">2. Exercise as the Most Potent Drug</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">Zone 2 Training:</span> Low-intensity, steady-state cardio to build mitochondrial efficiency.</li>
                        <li><span class="font-bold">Strength Training:</span> Muscle mass is the organ of longevity. It protects against frailty and metabolic dysfunction.</li>
                        <li><span class="font-bold">VO2 Max:</span> The single strongest correlate with longevity. Higher VO2 max = lower all-cause mortality.</li>
                    </ul>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">3. Metabolic Health</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">Insulin Resistance:</span> The upstream driver of most chronic diseases. Keep blood glucose stable and insulin sensitivity high.</li>
                        <li><span class="font-bold">Nutrition:</span> There is no "perfect" diet. The right diet is the one that allows you to maintain muscle mass and metabolic health while avoiding visceral fat.</li>
                    </ul>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">4. Emotional Health</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">The ignored pillar:</span> It doesn't matter if you live to 100 if you are miserable. Trauma and stress physically damage the body.</li>
                        <li><span class="font-bold">Strategy:</span> Treat emotional health with the same rigor as physical metrics.</li>
                    </ul>
                </div>
            </div>

            {text:"Prevention is the only cure for chronic disease.",context:"Timing: Once you have the diagnosis, the war is already half lost. The battle must be fought in the decades prior."}
        ]},
        {id:18,title:"The Untethered Soul",author:"Michael Singer",category:"Spirituality",synopsis:`
            <div class="flex flex-col gap-8 text-[13px] leading-relaxed text-gray-700 max-w-3xl mx-auto py-4">
                <div class="space-y-1">
                    <h2 class="font-bold text-gray-900 text-base">The Journey Beyond Yourself</h2>
                    <p>The goal is to free yourself from the tyranny of the "voice in your head" and live in a state of inner freedom and openness.</p>
                </div>

                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">The Roommate:</span> Treat your inner monologue like a neurotic roommate. You don't have to believe everything it says. You are the one <span class="italic">hearing</span> the voice, not the voice itself.</li>

                    <h3 class="font-bold text-gray-900">2. The Inner Thorn</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">The Concept:</span> We build our entire lives around avoiding touching our inner thorns (past pain/trauma).</li>
                        <li><span class="font-bold">The Solution:</span> Instead of protecting the thorn, pull it out. When pain arises, relax and release. Let it pass through you.</li>

                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">3. Staying Open</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">

                    <h3 class="font-bold text-gray-900">4. Death as a Teacher</h3>

        {id:19,title:"Man's Search for Meaning",author:"Viktor Frankl",category:"Resilience",synopsis:`
            <div class="flex flex-col gap-8 text-[13px] leading-relaxed text-gray-700 max-w-3xl mx-auto py-4">
                <div class="space-y-1">
                    <h2 class="font-bold text-gray-900 text-base">Logotherapy: Will to Meaning</h2>
                    <p>Based on Frankl's experiences in Nazi concentration camps, the book argues that the primary human drive is not pleasure (Freud) or power (Adler), but the pursuit of what we find meaningful.</p>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">1. The Last Human Freedom</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">The Concept:</span> Everything can be taken from a man but one thing: the last of the human freedoms—to choose one’s attitude in any given set of circumstances.</li>
                        <li><span class="font-bold">Stimulus and Response:</span> Between stimulus and response, there is a space. In that space is our power to choose our response. In our response lies our growth and our freedom.</li>
                    </ul>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">2. Finding Meaning</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">Through Work:</span> Doing a deed or creating a work.</li>
                        <li><span class="font-bold">Through Love:</span> Experiencing something (nature, art) or encountering someone.</li>
                        <li><span class="font-bold">Through Suffering:</span> Turning a personal tragedy into a triumph. When we are no longer able to change a situation, we are challenged to change ourselves.</li>
                    </ul>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">3. Tragic Optimism</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">The Concept:</span> Remaining optimistic in spite of the "tragic triad" (pain, guilt, and death).</li>
                        <li><span class="font-bold">He who has a why:</span> As Nietzsche said, "He who has a why to live can bear almost any how."</li>
                    </ul>
                </div>
            </div>
        `,quotes:[
            {text:"Everything can be taken from a man but one thing: the last of the human freedoms—to choose one’s attitude in any given set of circumstances.",context:"Ultimate Sovereignty: External conditions are not the final arbiter of your experience. Your internal stance is inviolable."},
            {text:"When we are no longer able to change a situation, we are challenged to change ourselves.",context:"Adaptability: Meaning is found not in controlling the world, but in mastering your response to it."},
            {text:"Those who have a 'why' to live, can bear with almost any 'how'.",context:"Purpose as fuel: A strong sense of meaning provides the psychological durability to survive trauma."},
            {text:"Meaning is possible even in spite of suffering.",context:"Reframing: Suffering ceases to be suffering at the moment it finds a meaning, such as the meaning of a sacrifice."},
            {text:"Happiness cannot be pursued; it must ensue.",context:"The Paradox of Hedonism: Happiness is the unintended side-effect of one's personal dedication to a cause greater than oneself."}

        {id:20,title:"Breath",author:"James Nestor",category:"Wellness",synopsis:`
            <div class="flex flex-col gap-8 text-[13px] leading-relaxed text-gray-700 max-w-3xl mx-auto py-4">
                <div class="space-y-1">
                    <h2 class="font-bold text-gray-900 text-base">The New Science of a Lost Art</h2>
                    <p>Modern humans have lost the ability to breathe correctly, with devastating consequences for our physical and mental health. This book explores how to reclaim the power of breath.</p>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">1. Nose vs. Mouth</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">The Rule:</span> Shut your mouth. Mouth breathing is chronic stress. It alters facial structure, ruins sleep, and decreases oxygen absorption.</li>
                        <li><span class="font-bold">The Nose:</span> The nose filters, heats, and treats raw air. It releases nitric oxide, which increases circulation and delivers oxygen to cells.</li>
                    </ul>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">2. Breathe Less</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">The Paradox:</span> We breathe too much. Chronic over-breathing expels too much carbon dioxide, which actually <span class="italic">reduces</span> oxygen delivery (The Bohr Effect).</li>
                        <li><span class="font-bold">Ideal Breathing:</span> 5.5 breaths per minute. 5.5 seconds in, 5.5 seconds out. This aligns heart rate variability (HRV) and nervous system balance.</li>
                    </ul>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">3. Chewing and Structure</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">The Evolution:</span> Soft industrial food has shrunk our jaws, causing crowded teeth and smaller airways.</li>
                        <li><span class="font-bold">The Fix:</span> Chewing hard foods and maintaining proper oral posture (tongue on the roof of the mouth) can open airways.</li>
                    </ul>
                </div>
            </div>
        `,quotes:[
            {text:"The perfect breath: Inhale for 5.5 seconds, exhale for 5.5 seconds. That’s 5.5 breaths a minute.",context:"Coherence: This specific rhythm aligns the heart, lungs, and brain into a state of optimal resonance."},
            {text:"Mouth breathing is biologically detrimental. Shut your mouth.",context:"The intake valve matters. The nose is the body's first line of defense and its primary regulation system."},

            {text:"Carbon dioxide is not a waste product; it is the catalyst for oxygen delivery.",context:"Physiology shift: You need CO2 to release O2 from hemoglobin. Over-breathing starves your tissues of oxygen."},
            {text:"To breathe is to absorb ourselves in what surrounds us.",context:"Connection: Breath is the physical link between the internal self and the external environment."}
        ]},
        {id:21,title:"Why We Sleep",author:"Matthew Walker",category:"Health",synopsis:`
            <div class="flex flex-col gap-8 text-[13px] leading-relaxed text-gray-700 max-w-3xl mx-auto py-4">
                <div class="space-y-1">
                    <h2 class="font-bold text-gray-900 text-base">Unlocking the Power of Sleep</h2>
                    <p>Sleep is the single most effective thing we can do to reset our brain and body health each day. It is the Swiss Army knife of health.</p>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">1. The Two Systems</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">Circadian Rhythm:</span> The 24-hour internal clock (driven by light/darkness).</li>
                        <li><span class="font-bold">Sleep Pressure:</span> The accumulation of adenosine. Caffeine works by blocking adenosine receptors, merely masking the pressure.</li>
                    </ul>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">2. REM vs. NREM</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">NREM (Deep Sleep):</span> Physical restoration, memory consolidation (moving facts from short-term to long-term storage).</li>
                        <li><span class="font-bold">REM (Dream Sleep):</span> Emotional first aid, creativity, and complex problem solving. It connects disparate ideas.</li>
                    </ul>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">3. The Consequences of Deprivation</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">Cognitive:</span> 4 hours of sleep reduces function to that of being legally drunk. There is no such thing as "catching up" on sleep.</li>
                        <li><span class="font-bold">Physical:</span> Short sleep predicts all-cause mortality, cancer, heart disease, and obesity.</li>
                    </ul>
                </div>
                <div class="space-y-1">
                    <h3 class="font-bold text-gray-900">4. Sleep Hygiene</h3>
                    <ul class="list-disc pl-5 space-y-1 mt-2">
                        <li><span class="font-bold">Regularity:</span> Go to bed and wake up at the same time every day.</li>
                        <li><span class="font-bold">Temperature:</span> Keep it cool (around 65°F / 18°C).</li>
                        <li><span class="font-bold">Darkness:</span> Melatonin requires darkness. Avoid blue light before bed.</li>
                    </ul>
                </div>
            </div>

            {text:"The shorter your sleep, the shorter your life.",context:"Mortality: There is a linear relationship between sleep duration and lifespan. Undercutting sleep is slow suicide."},

        }

        function toggleCategoryFilter(c) {
            if(activeCategories.includes(c)) activeCategories = activeCategories.filter(x => x !== c); else activeCategories.push(c);
            buildQuoteQueue(); renderLibrary('all'); renderFilterList(); nextQuoteManual();
        }

        function clearFilters() { activeCategories = []; buildQuoteQueue(); renderLibrary('all'); renderFilterList(); nextQuoteManual(); }

        window.addEventListener('click', (e) => {
            const pane = document.getElementById('filter-pane');
            const trigger = document.getElementById('active-context-count');
            if(pane && !pane.contains(e.target) && !trigger.contains(e.target) && !pane.classList.contains('hidden')) toggleFilterPane();
        });

        function startRotator() {
            if(rotatorInterval) clearInterval(rotatorInterval);
            timeLeft = 100;
            rotatorInterval = setInterval(() => {
                if(!isPaused && !isTransitioning) {
                    timeLeft -= (100 / (DURATION / 100));
                    updateRing(timeLeft);
                    if(timeLeft <= 0) { clearInterval(rotatorInterval); nextQuote(); }
                }
            }, 100);
        }

        function updateRing(p) {
            const circle = document.getElementById('progress-circle');
            const circumference = 10 * 2 * Math.PI;
            circle.style.strokeDashoffset = circumference - (p / 100) * circumference;
        }

        function nextQuote() { if(isTransitioning) return; currentQuoteIndex = (currentQuoteIndex + 1) % quoteQueue.length; transitionQuote(); }
        function prevQuote() { if(isTransitioning) return; currentQuoteIndex = (currentQuoteIndex - 1 + quoteQueue.length) % quoteQueue.length; transitionQuote(); }
        function nextQuoteManual() { if(isTransitioning) return; clearInterval(rotatorInterval); nextQuote(); }

        function transitionQuote() {
            isTransitioning = true;
            const wrapper = document.getElementById('quote-wrapper');
            const newQ = quoteQueue[currentQuoteIndex];
            const slide = document.createElement('div');
            slide.className = 'quote-slide flex flex-col items-center';
            slide.innerHTML = buildSlideHTML(newQ);
            
            updateTrayUI(newQ);
            wrapper.appendChild(slide);
            
            // Force a double-reflow to ensure browser has registered the initial state (opacity 0, translate 20px)
            void slide.offsetWidth;
            
            // Add active class in the next animation frame
            requestAnimationFrame(() => {
                slide.classList.add('active');
            });

            const slides = wrapper.querySelectorAll('.quote-slide');
            slides.forEach(s => {
                if(s !== slide) {
                    s.classList.remove('active');
                    setTimeout(() => { if(s.parentNode === wrapper) wrapper.removeChild(s); }, 1400);
                }
            });
            updateHeartUI(newQ);
            setTimeout(() => { 
                isTransitioning = false; 
                if(!isPaused && !isTrayOpen) startRotator(); 
            }, 1400);
        }

        function updateQuoteDOM(q) {
            const wrapper = document.getElementById('quote-wrapper');
            const slide = document.createElement('div');
            slide.className = 'quote-slide active flex flex-col items-center';
            slide.innerHTML = buildSlideHTML(q);
            updateTrayUI(q);
            wrapper.appendChild(slide);
            updateHeartUI(q);
        }

        function buildSlideHTML(q) {
            const len = q.text.length;
            let sizeClass = "text-4xl md:text-5xl lg:text-6xl";
            let whitespaceClass = "text-balance";
            if(len < 25) whitespaceClass = "whitespace-nowrap";
            if(len > 120) sizeClass = "text-2xl md:text-3xl lg:text-4xl";
            else if(len > 70) sizeClass = "text-3xl md:text-4xl lg:text-5xl";
            return `<div class="w-full px-6 md:px-12 flex justify-center"><div class="w-fit flex flex-col items-end max-w-4xl -translate-x-1"><div class="flex items-start"><span class="font-serif text-white opacity-60 text-4xl md:text-6xl mr-3 select-none leading-none mt-0.5">“</span><h2 class="quote-text font-serif font-medium text-white tracking-tight leading-relaxed drop-shadow-md transition-all duration-300 text-left ${sizeClass} ${whitespaceClass}">${cleanText(q.text)}<span class="opacity-60 ml-1 tracking-tighter select-none">”</span></h2></div><div onclick="jumpToBookContext()" class="quote-author mt-6 cursor-pointer group/meta pr-2"><p class="text-sm font-bold text-white/90 group-hover/meta:text-white transition-colors tracking-wide">— ${q.author}</p></div></div></div>`;
        }

        function updateTrayUI(q) {
            document.getElementById('tray-category').textContent = q.category;
            document.getElementById('tray-title').textContent = q.title;
            document.getElementById('detail-summary').textContent = q.context;
            const book = starterLibrary.find(b => b.id === q.bookId);
            if(book) injectBlueprint(book);
            
            // Also reset scroll if tray is already open and content changes
            const scrollArea = document.getElementById('blueprint-content');
            if(scrollArea && isTrayOpen) scrollArea.scrollTop = 0;
        }

        function injectBlueprint(book) {
            document.getElementById('detail-author').innerText = book.author;
            const meta = metaData[book.id];
            document.getElementById('spotify-link').href = meta.spotify || `https://open.spotify.com/search/${encodeURIComponent(book.title + " " + book.author)}`;
            document.getElementById('detail-leverage').innerText = meta.leverage;
            document.getElementById('detail-objective').innerText = meta.obj;
            document.getElementById('detail-constraint').innerText = meta.con;
            const list = document.getElementById('detail-quotes');
            list.innerHTML = '';
            book.quotes.forEach((qObj, i) => {
                const isF = favorites.includes(qObj.text);
                const li = document.createElement('li');
                li.className = `group/quote flex items-center justify-between py-4 cursor-pointer hover:bg-gray-50/50 px-2 transition-colors ${i !== book.quotes.length - 1 ? 'border-b border-gray-100' : ''}`;
                li.innerHTML = `<div class="quote-nav-trigger flex-1 text-sm text-gray-700 italic leading-relaxed pr-4">“${qObj.text}”</div><div class="heart-trigger w-10 h-10 flex items-center justify-center shrink-0 transition-colors ${isF ? 'text-rose-500' : 'text-gray-200 hover:text-rose-400'}"><svg class="w-4 h-4" fill="${isF ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg></div>`;
                li.querySelector('.quote-nav-trigger').onclick = (e) => { e.stopPropagation(); const targetIdx = quoteQueue.findIndex(item => item.text === qObj.text); if (targetIdx !== -1) { currentQuoteIndex = targetIdx; transitionQuote(); showToast("Perspective Swapped"); const scrollArea = document.getElementById('blueprint-content'); if (scrollArea) scrollArea.scrollTo({ top: 0, behavior: 'smooth' }); } };
                li.querySelector('.heart-trigger').onclick = (e) => { e.stopPropagation(); if(favorites.includes(qObj.text)) favorites = favorites.filter(f => f !== qObj.text); else favorites.push(qObj.text); saveState(); injectBlueprint(book); buildQuoteQueue(); updateHeartUI(quoteQueue[currentQuoteIndex]); };
                list.appendChild(li);
            });
        }

        function updateHeartUI(q) {
            const btn = document.getElementById('rotator-heart');
            const svg = btn.querySelector('svg');
            if(favorites.includes(q.text)) { btn.classList.add('bg-white/30'); svg.setAttribute('fill', 'white'); svg.setAttribute('stroke', 'white'); } 
            else { btn.classList.remove('bg-white/30'); svg.setAttribute('fill', 'none'); svg.setAttribute('stroke', 'currentColor'); }
        }

        function toggleHeartCurrent() { const q = quoteQueue[currentQuoteIndex]; if(favorites.includes(q.text)) favorites = favorites.filter(f => f !== q.text); else favorites.push(q.text); saveState(); updateHeartUI(q); buildQuoteQueue(); }

        function toggleDetail(e) {
            const view = document.getElementById('detail-view');
            isTrayOpen = !isTrayOpen;
            if(isTrayOpen) { 
                view.classList.add('detail-expanded'); 
                // Reset scroll to top immediately when opening
                const scrollArea = document.getElementById('blueprint-content');
                if(scrollArea) scrollArea.scrollTop = 0;
                
                isPaused = true; 
                if(rotatorInterval) clearInterval(rotatorInterval); 
            } 
            else { view.classList.remove('detail-expanded'); isPaused = false; startRotator(); }
        }

        function jumpToBookContext() { const q = quoteQueue[currentQuoteIndex]; const book = starterLibrary.find(b => b.title === q.title); if (book) { showDetail(book); document.getElementById('detail-view').scrollIntoView({ behavior: 'smooth' }); } }

        function flipBack() {
            const view = document.getElementById('detail-view');
            const scene = document.getElementById('main-scene');
            scene.classList.remove('expanded-scene');
            view.classList.remove('synopsis-mode');
            setTimeout(() => {
                document.getElementById('flip-container').classList.remove('is-flipped');
                const currentQ = quoteQueue[currentQuoteIndex];
                updateTrayUI(currentQ);
                isPaused = false;
                startRotator();
            }, 600);
        }

        function injectFlipInsights(book) {
            const list = document.getElementById('flip-insights-list');
            list.innerHTML = '';
            book.quotes.forEach((qObj, i) => {
                const isF = favorites.includes(qObj.text);
                const li = document.createElement('li');
                li.className = `group/flip-quote flex items-center justify-between py-3 cursor-pointer hover:bg-indigo-50/50 rounded-lg px-2 transition-all ${i !== book.quotes.length - 1 ? 'border-b border-gray-50' : ''}`;
                // Pass the text instead of the index
                li.onclick = () => jumpToQuoteFromBack(qObj.text);
                li.innerHTML = `<div class="flex-1 text-sm text-gray-600 group-hover/flip-quote:text-indigo-900 leading-relaxed pr-4 flex gap-2"><span class="text-indigo-300 opacity-50 group-hover/flip-quote:opacity-100 transition-opacity">●</span> <span>“${qObj.text}”</span></div><div class="flip-heart-trigger w-8 h-8 flex items-center justify-center shrink-0 cursor-pointer transition-colors ${isF ? 'text-rose-500' : 'text-gray-200 hover:text-rose-400'}"><svg class="w-3.5 h-3.5" fill="${isF ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg></div>`;
                li.querySelector('.flip-heart-trigger').onclick = (e) => { 
                    e.stopPropagation(); 
                    if(favorites.includes(qObj.text)) favorites = favorites.filter(f => f !== qObj.text); else favorites.push(qObj.text); 
                    saveState(); 
                    injectFlipInsights(book);
                    injectBlueprint(book); 
                    buildQuoteQueue(); 
                    updateHeartUI(quoteQueue[currentQuoteIndex]); 
                };
                list.appendChild(li);
            });
        }

        function showDetail(book) {
            const view = document.getElementById('detail-view');
            const flipContainer = document.getElementById('flip-container');
            const scene = document.getElementById('main-scene');
            const scrollArea = document.getElementById('flip-scroll-area');

            if (book.synopsis) {
                isPaused = true;
                clearInterval(rotatorInterval);
                const performFlip = () => {
                    document.getElementById('flip-book-title').textContent = book.title;
                    document.getElementById('flip-book-category').textContent = book.category;
                    document.getElementById('flip-book-author-line').textContent = "by " + book.author;
                    document.getElementById('flip-chapter-content').innerHTML = book.synopsis;
                    injectFlipInsights(book);
                    if(scrollArea) scrollArea.scrollTop = 0;
                    const meta = metaData[book.id];
                    document.getElementById('flip-spotify-link').href = meta.spotify || `https://open.spotify.com/search/${encodeURIComponent(book.title + " " + book.author)}`;
                    scene.classList.add('expanded-scene');
                    flipContainer.classList.add('is-flipped');
                    view.classList.add('synopsis-mode');
                    isTrayOpen = false;
                };
                if (isTrayOpen || document.querySelector('.detail-expanded')) {
                    view.classList.remove('detail-expanded');
                    setTimeout(performFlip, 600);
                } else { performFlip(); }
            } else {
                const performJump = () => {
                    injectBlueprint(book);
                    document.getElementById('tray-title').textContent = book.title;
                    document.getElementById('tray-category').textContent = book.category;
                    document.getElementById('detail-summary').textContent = book.quotes[0].context;
                    view.classList.add('detail-expanded');
                    const blueprintScroll = document.getElementById('blueprint-content');
                    if(blueprintScroll) blueprintScroll.scrollTop = 0;
                    isTrayOpen = true; isPaused = true; clearInterval(rotatorInterval);
                };
                if (isTrayOpen) { view.classList.remove('detail-expanded'); isTrayOpen = false; setTimeout(performJump, 600); } else { performJump(); }
            }
        }

        function jumpToQuoteFromBack(quoteText) {
            // Find the index in the global queue by matching text
            const targetIndex = quoteQueue.findIndex(q => q.text === quoteText);
            
            if (targetIndex === -1) {
                // Should not happen if data is consistent, but safety fallback
                console.error("Quote not found in active queue:", quoteText);
                return;
            }

            // 1. Flip back to front (card transition)
            const view = document.getElementById('detail-view');
            const scene = document.getElementById('main-scene');
            const flipContainer = document.getElementById('flip-container');

            // Force cleanup of back-state classes immediately
            scene.classList.remove('expanded-scene');
            view.classList.remove('synopsis-mode');
            flipContainer.classList.remove('is-flipped');

            // 2. Immediate data update (snap the carousel)
            currentQuoteIndex = targetIndex;
            const targetQ = quoteQueue[currentQuoteIndex];
            updateTrayUI(targetQ); // Populate the tray with new data BEFORE showing it
            
            // 3. Re-render the slide so it's visible on the front immediately
            // (We skip the animation here to make it feel instant upon arrival)
            const wrapper = document.getElementById('quote-wrapper');
            wrapper.innerHTML = ''; 
            const slide = document.createElement('div');
            slide.className = 'quote-slide active flex flex-col items-center';
            slide.innerHTML = buildSlideHTML(targetQ);
            wrapper.appendChild(slide);
            updateHeartUI(targetQ);

            // 4. Wait for the flip animation (600ms CSS transition) to mostly finish, then expand tray
            setTimeout(() => {
                // Force expand the tray
                view.classList.add('detail-expanded');
                isTrayOpen = true;
                isPaused = true;
                if(rotatorInterval) clearInterval(rotatorInterval);
                
                // Ensure blueprint is scrolled to top
                const blueprintScroll = document.getElementById('blueprint-content');
                if(blueprintScroll) blueprintScroll.scrollTop = 0;
            }, 500); // 500ms allows the flip to be nearly done but feels snappy
        }

        function renderLibrary(filter) {
            const list = document.getElementById('library-list');
            list.innerHTML = '';
            const books = (filter === 'all' ? starterLibrary : starterLibrary.filter(b => b.quotes.some(q => favorites.includes(q.text)))).filter(b => activeCategories.length === 0 || activeCategories.includes(b.category));
            const cats = {};
            books.forEach(b => { if(!cats[b.category]) cats[b.category] = []; cats[b.category].push(b); });
            Object.keys(cats).sort().forEach(c => {
                const active = activeCategories.includes(c);
                const tile = document.createElement('details'); tile.open = true; tile.className = "category-tile bg-white rounded-xl border border-gray-100 mb-3 overflow-hidden transition-all";
                tile.innerHTML = `<summary class="flex items-center justify-between px-3 py-3 cursor-pointer select-none"><span class="category-name text-[10px] font-bold uppercase tracking-widest ${active ? 'text-indigo-600' : 'text-gray-500'} hover:text-indigo-500 transition-colors">${c}</span><div class="flex items-center gap-3"><span class="text-[10px] font-bold text-gray-300">${cats[c].length}</span><div class="category-chevron w-4 h-4 transition-transform duration-300"><svg class="w-3.5 h-3.5 text-gray-300" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg></div></div></summary>`;
                const bookDiv = document.createElement('div');
                bookDiv.className = "px-1 pb-2 space-y-1 border-t border-gray-50 pt-2";
                cats[c].forEach(b => {
                    const item = document.createElement('div');
                    item.className = "px-3 py-2 text-[12px] text-gray-700 truncate cursor-pointer hover:bg-gray-50 rounded-lg";
                    item.textContent = b.title;
                    item.onclick = () => showDetail(b);
                    bookDiv.appendChild(item);
                });
                tile.appendChild(bookDiv); list.appendChild(tile);
            });
        }

        function toggleAllAccordions() {
            const tiles = document.querySelectorAll('.category-tile');
            // Check if ANY are closed. If so, open ALL. If all are open, close ALL.
            const anyClosed = Array.from(tiles).some(t => !t.hasAttribute('open'));
            
            tiles.forEach(t => {
                if (anyClosed) t.setAttribute('open', '');
                else t.removeAttribute('open');
            });
            
            // Toggle icon direction
            const btn = document.getElementById('accordion-toggle');
            btn.innerHTML = anyClosed 
                ? `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8 9l4-4 4 4m0 6l-4 4-4-4" /></svg>` // Expand icon
                : `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16 15l-4 4-4-4m0-6l4-4 4 4" /></svg>`; // Collapse icon
        }

        function setFilter(type) {
            const btnAll = document.getElementById('filter-all');
            const btnFav = document.getElementById('filter-favorites');
            
            // Base classes for layout (identical for both states)
            const baseClass = "flex-1 py-1.5 text-[10px] uppercase rounded-md shadow-sm transition-all flex items-center justify-center gap-2";
            
            // State-specific classes
            const activeState = "font-bold bg-gray-900 text-white";
            const inactiveState = "font-medium text-gray-500 hover:text-gray-900 hover:bg-gray-200/50";

            if (type === 'all') {
                btnAll.className = `${baseClass} ${activeState}`;
                btnFav.className = `${baseClass} ${inactiveState}`;
                
                // Heart Outline
                btnFav.querySelector('svg').setAttribute('fill', 'none');
                btnFav.querySelector('svg').setAttribute('stroke', 'currentColor');
                btnFav.classList.remove('text-rose-500');
            } else {
                btnAll.className = `${baseClass} ${inactiveState}`;
                btnFav.className = `${baseClass} ${activeState}`;
                
                // Heart Solid
                btnFav.querySelector('svg').setAttribute('fill', 'white');
                btnFav.querySelector('svg').setAttribute('stroke', 'white');
            }
            renderLibrary(type);
        }

        function handleSearch(val) {
            const query = val.toLowerCase();
            const list = document.getElementById('library-list');
            
            // Check which button is active (Library vs Saved)
            const isFavFilter = document.getElementById('filter-favorites').classList.contains('bg-gray-900') || 
                               document.getElementById('filter-favorites').classList.contains('text-gray-900');
            const filter = isFavFilter ? 'favorites' : 'all';
            
            let books = filter === 'all' ? starterLibrary : starterLibrary.filter(b => b.quotes.some(x => favorites.includes(x.text)));
            
            // LOGIC: If user is typing, search ALL books in the current view (Library or Saved)
            // If search is EMPTY, fall back to active topic filters.
            if (query) {
                books = books.filter(b => b.title.toLowerCase().includes(query) || b.author.toLowerCase().includes(query) || b.category.toLowerCase().includes(query));
            } else if (activeCategories.length > 0) {
                books = books.filter(b => activeCategories.includes(b.category));
            }
            
            list.innerHTML = '';
            const cats = {};
            books.forEach(b => { if(!cats[b.category]) cats[b.category] = []; cats[b.category].push(b); });
            Object.keys(cats).sort().forEach(c => {
                const active = activeCategories.includes(c);
                const tile = document.createElement('details'); tile.open = true; tile.className = "category-tile bg-white rounded-xl border border-gray-100 mb-3 overflow-hidden transition-all";
                tile.innerHTML = `<summary class="flex items-center justify-between px-3 py-3 cursor-pointer select-none"><span class="category-name text-[10px] font-bold uppercase tracking-widest ${active ? 'text-indigo-600' : 'text-gray-500'} hover:text-indigo-500 transition-colors">${c}</span><div class="flex items-center gap-3"><span class="text-[10px] font-bold text-gray-300">${cats[c].length}</span><div class="category-chevron w-4 h-4 transition-transform duration-300"><svg class="w-3.5 h-3.5 text-gray-300" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg></div></div></summary>`;
                const bookDiv = document.createElement('div');
                bookDiv.className = "px-1 pb-2 space-y-1 border-t border-gray-50 pt-2";
                cats[c].forEach(b => {
                    const item = document.createElement('div');
                    item.className = "px-3 py-2 text-[12px] text-gray-700 truncate cursor-pointer hover:bg-gray-50 rounded-lg";
                    item.textContent = b.title;
                    item.onclick = () => showDetail(b);
                    bookDiv.appendChild(item);
                });
                tile.appendChild(bookDiv); list.appendChild(tile);
            });
        }

        function pauseTimer() { isPaused = true; }
        function resumeTimer() { isPaused = false; }
        function cleanText(text) { return text.replace(/"/g, '').replace(/'/g, '’').replace(/\.\.\./g, '…'); }
        function showToast(msg) { const toast = document.getElementById('toast'); toast.textContent = msg; toast.classList.remove('opacity-0'); setTimeout(() => toast.classList.add('opacity-0'), 2000); }
        
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>

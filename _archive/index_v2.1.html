<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MojoHub 2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .text-balance { text-wrap: balance; }

        /* Slow, Elegant Gradient (30s) */
        @keyframes hueCycle { 0% { filter: hue-rotate(0deg) saturate(1.1); } 50% { filter: hue-rotate(180deg) saturate(1.2); } 100% { filter: hue-rotate(360deg) saturate(1.1); } }
        @keyframes gradientPulse { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .animate-gradient { background: linear-gradient(125deg, #4f46e5, #7c3aed, #db2777, #2563eb); background-size: 300% 300%; animation: gradientPulse 30s ease-in-out infinite, hueCycle 90s linear infinite; }

        /* LIQUID TRANSITION LOGIC */
        .quote-wrapper { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .quote-slide { position: absolute; width: 100%; opacity: 0; transform: scale(0.98) translateY(10px); pointer-events: none; transition: opacity 1.4s ease-in-out, transform 1.4s ease-in-out; will-change: opacity, transform; }
        .quote-slide.active { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; z-index: 10; }
        .quote-slide .quote-author { opacity: 0; transform: translateY(8px); transition: opacity 1.4s ease-out, transform 1.4s ease-out; transition-delay: 300ms; }
        .quote-slide.active .quote-author { opacity: 1; transform: translateY(0); }
        
        .progress-ring__circle { transition: stroke-dashoffset 0.1s linear; transform: rotate(-90deg); transform-origin: 50% 50%; }
        .detail-expanded { max-height: 1000px !important; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 h-screen flex flex-col overflow-hidden">

    <header class="w-full bg-white border-b border-gray-200 z-10 shrink-0 h-14">
        <div class="max-w-6xl mx-auto px-6 h-full flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="flex gap-1.5 opacity-40 hover:opacity-100 transition-opacity">
                    <div class="w-2.5 h-2.5 rounded-full bg-slate-400"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-slate-400"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-slate-400"></div>
                </div>
                <span class="ml-4 font-semibold text-xs uppercase tracking-widest text-gray-500">MojoHub 2.1</span>
                <span id="active-context" class="hidden md:inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-gray-100 text-gray-500 ml-2 transition-all">All Contexts</span>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="exportData()" class="p-2 text-gray-400 hover:text-gray-900 transition-colors" title="Backup"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg></button>
                <button onclick="triggerImport()" class="p-2 text-gray-400 hover:text-gray-900 transition-colors" title="Restore"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg></button>
                <input type="file" id="import-file" class="hidden" accept=".json" onchange="importData(this)">
                <button onclick="toggleAddModal()" class="group flex items-center gap-2 px-3 py-1.5 rounded-md hover:bg-gray-50 transition-colors border border-transparent hover:border-gray-200">
                    <span class="text-xs font-medium text-gray-500 group-hover:text-gray-900 tracking-tight">Add Book</span>
                    <svg class="text-gray-400 group-hover:text-gray-900 transition-colors" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2.5V9.5M2.5 6H9.5"/></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-6xl mx-auto w-full p-6 grid grid-cols-12 gap-6 overflow-hidden">
        
        <section class="order-1 md:order-2 col-span-12 md:col-span-8 lg:col-span-9 flex flex-col gap-6 h-full overflow-y-auto scrollbar-hide pb-10">
            <div id="hero-card" class="relative z-20 w-full min-h-[420px] rounded-t-2xl rounded-b-none shadow-none flex flex-col p-8 md:p-12 text-center group overflow-hidden transition-all duration-500 bg-gradient-to-br from-indigo-600 via-purple-600 to-rose-500 animate-gradient" onmouseenter="pauseTimer()" onmouseleave="resumeTimer()">
                
                <div class="absolute inset-0 opacity-20 pointer-events-none mix-blend-overlay" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');"></div>

                <div class="absolute top-6 left-6 flex gap-2 z-20 transition-opacity duration-300">
                    <button onclick="prevQuote()" class="p-2 rounded-full bg-white/10 hover:bg-white/20 text-white/70 hover:text-white transition-colors backdrop-blur-md border border-white/10 shadow-sm"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
                    <button onclick="nextQuoteManual()" class="p-2 rounded-full bg-white/10 hover:bg-white/20 text-white/70 hover:text-white transition-colors backdrop-blur-md border border-white/10 shadow-sm"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
                </div>
                <div class="absolute top-6 right-6 flex gap-2 z-20 transition-opacity duration-300">
                    <button onclick="toggleHeartCurrent()" id="rotator-heart" class="p-2 rounded-full bg-white/10 hover:bg-white/20 text-white/70 hover:text-red-300 transition-colors backdrop-blur-md border border-white/10 shadow-sm"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg></button>
                    <button onclick="nextQuoteManual()" class="p-2 rounded-full bg-white/10 hover:bg-white/20 text-white/70 hover:text-white transition-colors backdrop-blur-md border border-white/10 shadow-sm"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><line x1="21" y1="16" x2="21" y2="21"></line><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg></button>
                </div>

                <div class="relative z-10 flex-1 flex items-center justify-center w-full pt-8">
                    <div id="quote-wrapper" class="quote-wrapper"></div>
                </div>

                <div class="absolute bottom-6 right-6 z-20">
                    <svg class="progress-ring" width="24" height="24">
                        <circle class="text-white/20" stroke="currentColor" stroke-width="2" fill="transparent" r="10" cx="12" cy="12"/>
                        <circle id="progress-circle" class="text-white/80 progress-ring__circle" stroke="currentColor" stroke-width="2" fill="transparent" r="10" cx="12" cy="12" stroke-dasharray="62.83" stroke-dashoffset="0"/>
                    </svg>
                </div>
            </div>

            <div id="detail-view" onclick="toggleDetail(event)" class="group transition-all duration-500 ease-[cubic-bezier(0.25,0.8,0.25,1)] bg-white rounded-t-none rounded-b-2xl border-x border-b border-gray-200 shadow-lg relative overflow-hidden -mt-6 z-10 max-h-12 cursor-pointer hover:bg-gray-50 w-full">
                <div class="absolute top-0 left-0 w-full h-12 flex items-center justify-between px-6 z-20 pointer-events-none">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <span id="tray-title" class="text-sm font-medium text-gray-400 truncate"></span>
                        <span id="tray-category" class="shrink-0 px-2.5 py-0.5 rounded-full bg-gray-100 text-[10px] font-bold text-gray-500 uppercase tracking-wider"></span>
                    </div>
                    <svg class="w-5 h-5 text-gray-300 group-hover:text-gray-500 transition-all duration-300 transform group-[.detail-expanded]:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </div>
                <div class="p-8 pt-16 opacity-50 group-[.detail-expanded]:opacity-100 transition-opacity duration-500 delay-100">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <span id="detail-category" class="inline-block px-2 py-0.5 rounded border border-gray-200 text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-3">Category</span>
                            <h3 id="detail-title" class="text-2xl font-bold text-gray-900 tracking-tight mb-1">Book Title</h3>
                            <p id="detail-author" class="text-sm text-gray-500 font-medium">Author Name</p>
                        </div>
                        <a id="spotify-link" href="#" target="_blank" onclick="event.stopPropagation()" class="flex items-center gap-2 px-4 py-2 bg-[#1DB954] text-white rounded-lg hover:bg-[#1ed760] transition-colors shadow-sm text-xs font-bold tracking-wide">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
                            Listen
                        </a>
                    </div>
                    <p id="detail-summary" class="text-sm text-gray-600 leading-relaxed border-b border-gray-100 pb-6 mb-6">Summary...</p>
                    <h4 class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-4">Insights</h4>
                    <ul id="detail-quotes" class="space-y-4"></ul>
                </div>
            </div>
        </section>

        <aside class="order-2 md:order-1 col-span-12 md:col-span-4 lg:col-span-3 flex flex-col gap-4 h-full overflow-hidden">
            <div class="flex flex-col gap-3 shrink-0">
                <div class="flex p-1 bg-gray-100 rounded-lg border border-gray-200">
                    <button onclick="setFilter('all')" id="filter-all" class="flex-1 py-1.5 text-[11px] font-bold uppercase tracking-wide rounded-[4px] bg-white text-gray-900 shadow-sm border border-gray-200 transition-all">All</button>
                    <button onclick="setFilter('favorites')" id="filter-favorites" class="flex-1 py-1.5 text-[11px] font-medium uppercase tracking-wide rounded-[4px] text-gray-500 hover:text-gray-700 transition-all">Saved</button>
                </div>
                <div class="relative group">
                    <input type="text" id="library-search" oninput="handleSearch(this.value)" placeholder="Search books..." class="w-full bg-gray-50 border border-gray-200 rounded-lg pl-8 pr-3 py-2 text-xs focus:ring-1 focus:ring-gray-300 focus:border-gray-400 outline-none transition-all">
                    <svg class="absolute left-2.5 top-2.5 text-gray-400 group-focus-within:text-gray-600 transition-colors" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </div>
            </div>
            <div id="library-list" class="flex-1 overflow-y-auto pr-1 space-y-2 scrollbar-hide pb-20"></div>
        </aside>
    </main>

    <div id="add-modal" class="fixed inset-0 bg-white/95 backdrop-blur-sm z-50 hidden flex items-center justify-center transition-opacity duration-200 opacity-0">
        <div class="bg-white w-full max-w-lg p-8 rounded-2xl border border-gray-200 shadow-2xl transform scale-95 transition-transform duration-200">
            <h3 class="text-lg font-bold text-gray-900 tracking-tight mb-6">Add to Library</h3>
            <form id="add-form" class="space-y-5">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="input-title" class="w-full px-3 py-2 bg-gray-50 border rounded-md text-sm" placeholder="Title" required>
                    <input type="text" id="input-author" class="w-full px-3 py-2 bg-gray-50 border rounded-md text-sm" placeholder="Author" required>
                </div>
                <select id="input-category" class="w-full px-3 py-2 bg-gray-50 border rounded-md text-sm"><option>Strategy</option><option>Wealth</option><option>Focus</option><option>Creativity</option><option>Mindset</option><option>Psychology</option></select>
                <textarea id="input-summary" rows="2" class="w-full px-3 py-2 bg-gray-50 border rounded-md text-sm" placeholder="Summary"></textarea>
                <textarea id="input-quotes" rows="4" class="w-full px-3 py-2 bg-gray-50 border rounded-md text-sm" placeholder="Quotes (Line separated)"></textarea>
                <div class="pt-2 flex gap-2">
                    <button type="submit" class="flex-1 py-2.5 text-sm font-semibold text-white bg-gray-900 rounded-lg">Save</button>
                    <button type="button" onclick="toggleAddModal()" class="flex-1 py-2.5 text-sm font-semibold text-gray-500 bg-gray-100 rounded-lg">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50"></div>

    <script>
        // UTILS
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => { toast.classList.add('opacity-0', 'pointer-events-none'); }, 3000);
        }
        function exportData() {
            const data = { version: "1.0", timestamp: Date.now(), library: library, favorites: favorites };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `mojohub_backup_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
            showToast("Backup Downloaded");
        }
        function triggerImport() { document.getElementById('import-file').click(); }
        function importData(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.library) {
                        library = data.library;
                        favorites = data.favorites || [];
                        saveState();
                        activeFilterCategory = "All";
                        renderLibrary('all');
                        buildQuoteQueue();
                        nextQuoteManual();
                        showToast("Library Restored");
                    }
                } catch (err) { showToast("Error Reading File"); }
                input.value = ''; 
            };
            reader.readAsText(file);
        }
        function cleanText(text) { return text.replace(/"/g, '').replace(/'/g, '’').replace(/\.\.\./g, '…'); }

        // DATA (Minified for safety)
        const starterLibrary=[
        {id:1,title:"$100M Offers",author:"Alex Hormozi",category:"Strategy",summary:"Make offers so good people feel stupid saying no.",quotes:["Make people an offer so good they would feel stupid saying no.","Volume negates luck.","Attention is the new currency."]},
        {id:2,title:"Atomic Habits",author:"James Clear",category:"Focus",summary:"Tiny changes, remarkable results.",quotes:["You do not rise to the level of your goals. You fall to the level of your systems.","Habits are the compound interest of self-improvement."]},
        {id:3,title:"The Psychology of Money",author:"Morgan Housel",category:"Wealth",summary:"Psychology > Math.",quotes:["Wealth is what you don't see.","Save money. Just save it."]},
        {id:4,title:"Deep Work",author:"Cal Newport",category:"Focus",summary:"Rules for focused success.",quotes:["Deep work is the superpower of the 21st century.","Drain the shallows."]},
        {id:5,title:"The Creative Act",author:"Rick Rubin",category:"Creativity",summary:"A way of being.",quotes:["The universe is not static.","We are all creators."]},
        {id:6,title:"Zero to One",author:"Peter Thiel",category:"Strategy",summary:"Build the future.",quotes:["Competition is for losers.","Sales matters just as much as product."]},
        {id:7,title:"Antifragile",author:"Nassim Taleb",category:"Strategy",summary:"Gain from disorder.",quotes:["Wind extinguishes a candle and energizes fire.","Avoid the middle."]},
        {id:8,title:"Essentialism",author:"Greg McKeown",category:"Focus",summary:"Less but better.",quotes:["If it isn't a clear yes, then it's a clear no.","Less but better."]},
        {id:9,title:"The War of Art",author:"Steven Pressfield",category:"Mindset",summary:"Win creative battles.",quotes:["The amateur plays for fun. The professional plays for keeps.","Start before you are ready."]},
        {id:10,title:"Influence",author:"Robert Cialdini",category:"Psychology",summary:"Persuasion science.",quotes:["Social proof is powerful.","Reciprocity is a key driver."]}
        ];

        let library = JSON.parse(localStorage.getItem('mojo_library_v13')) || starterLibrary;
        let favorites = JSON.parse(localStorage.getItem('mojo_favorites_v13')) || [];
        let currentQuoteIndex = 0;
        let activeQuoteInterval;
        let quoteQueue = [];
        let activeFilterCategory = "All";
        let searchQuery = "";
        let isPaused = false;

        function saveState() {
            localStorage.setItem('mojo_library_v13', JSON.stringify(library));
            localStorage.setItem('mojo_favorites_v13', JSON.stringify(favorites));
        }

        function init() {
            renderLibrary('all');
            buildQuoteQueue();
            startQuoteRotator();
            if(quoteQueue.length > 0) updateQuoteDOM(quoteQueue[0]);
        }

        function handleSearch(val) {
            searchQuery = val.toLowerCase();
            renderLibrary(document.getElementById('filter-favorites').classList.contains('font-bold') ? 'favorites' : 'all');
        }

        function buildQuoteQueue() {
            quoteQueue = [];
            let source = library;
            if(activeFilterCategory !== "All") source = library.filter(b => b.category === activeFilterCategory);
            source.forEach(book => {
                book.quotes.forEach(q => {
                    const isFav = favorites.includes(q);
                    const item = { text: q, author: book.author, title: book.title, category: book.category, fav: isFav };
                    if(isFav) { quoteQueue.push(item); quoteQueue.push(item); }
                    quoteQueue.push(item);
                });
            });
            quoteQueue.sort(() => Math.random() - 0.5);
            if(quoteQueue.length === 0) quoteQueue.push({ text: "No quotes found.", author: "System", title: "", category: "System" });
            
            const pill = document.getElementById('active-context');
            pill.textContent = activeFilterCategory === "All" ? "All Contexts" : activeFilterCategory;
        }

        function setActiveCategory(cat) {
            activeFilterCategory = (activeFilterCategory === cat) ? "All" : cat;
            buildQuoteQueue(); 
            nextQuoteManual(); 
            renderLibrary(document.getElementById('filter-favorites').classList.contains('font-bold') ? 'favorites' : 'all');
        }

        // SMART TIMER: Base 8s + 0.5s per word
        function calculateDuration(text) {
            const wordCount = text.trim().split(/\s+/).length;
            return 8000 + (wordCount * 500);
        }

        function startQuoteRotator() {
            if(activeQuoteInterval) clearInterval(activeQuoteInterval);
            const currentQuote = quoteQueue[currentQuoteIndex];
            const duration = (currentQuote && currentQuote.text) ? calculateDuration(currentQuote.text) : 10000;
            
            timeLeft = 100;
            timerStep = 100 / (duration / 100);
            
            activeQuoteInterval = setInterval(() => {
                if(!isPaused) {
                    timeLeft -= timerStep;
                    updateRing(timeLeft);
                    if(timeLeft <= 0) nextQuote();
                }
            }, 100);
        }

        function pauseTimer() { isPaused = true; }
        function resumeTimer() { if (!isTrayOpen) isPaused = false; }

        function nextQuote() {
            clearInterval(activeQuoteInterval);
            currentQuoteIndex = (currentQuoteIndex + 1) % quoteQueue.length;
            transitionQuote();
            startQuoteRotator();
        }
        function prevQuote() {
            clearInterval(activeQuoteInterval);
            currentQuoteIndex = (currentQuoteIndex - 1 + quoteQueue.length) % quoteQueue.length;
            transitionQuote();
            startQuoteRotator();
        }
        function nextQuoteManual() {
            clearInterval(activeQuoteInterval);
            nextQuote();
            startQuoteRotator();
        }

        function updateTrayInfo(q) {
            const catEl = document.getElementById('tray-category');
            const titleEl = document.getElementById('tray-title');
            if(catEl) catEl.textContent = q.category || '';
            if(titleEl) titleEl.textContent = q.title || '';
        }

        function transitionQuote() {
            const wrapper = document.getElementById('quote-wrapper');
            const newQ = quoteQueue[currentQuoteIndex];
            
            const slide = document.createElement('div');
            slide.className = 'quote-slide flex flex-col items-center';
            slide.innerHTML = buildSlideHTML(newQ);
            
            const textEl = slide.querySelector('.quote-text');
            applyDynamicFont(textEl, newQ.text);
            
            updateTrayInfo(newQ);
            wrapper.appendChild(slide);
            
            // Force Reflow for Liquid Transition
            void slide.offsetWidth; 
            
            slide.classList.add('active');
            const slides = wrapper.querySelectorAll('.quote-slide');
            if(slides.length > 1) {
                slides[0].classList.remove('active');
                setTimeout(() => slides[0].remove(), 1400);
            }
            updateHeart(newQ);
        }

        function updateQuoteDOM(q) {
            const wrapper = document.getElementById('quote-wrapper');
            const slide = document.createElement('div');
            slide.className = 'quote-slide active flex flex-col items-center';
            slide.innerHTML = buildSlideHTML(q);
            const textEl = slide.querySelector('.quote-text');
            applyDynamicFont(textEl, q.text);
            updateTrayInfo(q);
            wrapper.appendChild(slide);
            updateHeart(q);
        }

        function buildSlideHTML(q) {
            return `
                <div class="w-full px-6 md:px-12 flex justify-center">
                    <div class="w-fit flex flex-col items-end max-w-4xl -translate-x-1" data-book-title="${q.title}">
                        <div class="flex items-start">
                            <span class="font-serif text-white opacity-60 text-4xl md:text-5xl lg:text-6xl mr-3 select-none leading-none mt-0.5">“</span>
                            <h2 class="quote-text font-serif font-medium text-white text-balance tracking-tight leading-relaxed drop-shadow-md transition-all duration-300 text-left">
                                ${cleanText(q.text)}<span class="opacity-60 ml-1 tracking-tighter select-none">”</span>
                            </h2>
                        </div>
                        <div onclick="jumpToBookContext()" class="quote-author mt-6 cursor-pointer group/meta pr-2">
                            <p class="text-sm font-bold text-white/90 group-hover/meta:text-white transition-colors tracking-wide">— ${q.author}</p>
                        </div>
                    </div>
                </div>`;
        }

        function applyDynamicFont(el, text) {
            const len = text.length;
            let cls = "quote-text font-serif font-medium text-white tracking-tight drop-shadow-md transition-all duration-300 text-left";
            if (len < 22) cls += " whitespace-nowrap"; else cls += " text-balance";
            el.style.lineHeight = "";
            if (len < 50) { cls += " text-4xl md:text-5xl lg:text-6xl leading-[1.1]"; el.style.lineHeight = "1.1"; }
            else if (len < 100) cls += " text-3xl md:text-4xl leading-snug";
            else if (len < 200) cls += " text-2xl md:text-3xl leading-snug";
            else cls += " text-xl md:text-2xl leading-relaxed";
            el.className = cls;
        }

        function updateHeart(q) {
            const heartBtn = document.getElementById('rotator-heart');
            if(favorites.includes(q.text)) {
                heartBtn.classList.add('text-red-400', 'fill-current', 'bg-white/20');
                heartBtn.classList.remove('text-white/70', 'bg-white/10');
            } else {
                heartBtn.classList.remove('text-red-400', 'fill-current', 'bg-white/20');
                heartBtn.classList.add('text-white/70', 'bg-white/10');
            }
        }

        function toggleHeartCurrent() {
            const currentQuote = quoteQueue[currentQuoteIndex];
            if (!currentQuote) return;
            const idx = favorites.indexOf(currentQuote.text);
            if (idx > -1) { favorites.splice(idx, 1); showToast("Removed"); } 
            else { favorites.push(currentQuote.text); showToast("Saved"); }
            saveState();
            updateHeart(currentQuote);
            renderLibrary(document.getElementById('filter-favorites').classList.contains('font-bold') ? 'favorites' : 'all');
        }

        function updateRing(percent) {
            const circle = document.getElementById('progress-circle');
            const circumference = circle.r.baseVal.value * 2 * Math.PI;
            circle.style.strokeDashoffset = circumference - (percent / 100) * circumference;
        }

        function jumpToBookContext() {
            const activeSlide = document.querySelector('.quote-slide.active');
            if(!activeSlide) return;
            const container = activeSlide.querySelector('div[data-book-title]');
            if(!container) return;
            const book = library.find(b => b.title === container.getAttribute('data-book-title'));
            if (book) {
                showDetail(book);
                pauseTimer();
                document.getElementById('detail-view').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function renderLibrary(filter) {
            const list = document.getElementById('library-list');
            list.innerHTML = '';
            
            const activeClass = "flex-1 py-1.5 text-[11px] font-bold uppercase tracking-wide rounded-[4px] bg-white text-gray-900 shadow-sm border border-gray-200 transition-all";
            const inactiveClass = "flex-1 py-1.5 text-[11px] font-medium uppercase tracking-wide rounded-[4px] text-gray-500 hover:text-gray-700 transition-all";
            
            document.getElementById('filter-all').className = filter === 'all' ? activeClass : inactiveClass;
            document.getElementById('filter-favorites').className = filter === 'favorites' ? activeClass : inactiveClass;

            let booksToShow = filter === 'all' ? library : library.filter(b => b.quotes.some(q => favorites.includes(q)));
            
            // Apply Search Filter
            if (searchQuery) {
                booksToShow = booksToShow.filter(b => 
                    b.title.toLowerCase().includes(searchQuery) || 
                    b.author.toLowerCase().includes(searchQuery) ||
                    b.category.toLowerCase().includes(searchQuery)
                );
            }

            const categories = {};
            booksToShow.forEach(book => { if(!categories[book.category]) categories[book.category] = []; categories[book.category].push(book); });

            const sortedCats = Object.keys(categories).sort();
            
            sortedCats.forEach(cat => {
                const isContextActive = activeFilterCategory === cat;
                const section = document.createElement('details');
                section.className = "group/section";
                section.open = (searchQuery.length > 0 || isContextActive || sortedCats.length < 4);
                
                const summary = document.createElement('summary');
                summary.className = `list-none cursor-pointer flex items-center justify-between py-2 pl-1 transition-colors ${isContextActive ? 'text-blue-600' : 'text-gray-400 hover:text-gray-600'}`;
                
                summary.innerHTML = `
                    <div class="flex items-center gap-2" onclick="setActiveCategory('${cat}'); event.preventDefault();">
                        <span class="text-[10px] font-bold uppercase tracking-widest">${cat}</span>
                        ${isContextActive ? '<span class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-pulse"></span>' : ''}
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-[9px] font-bold opacity-40 group-open/section:opacity-0 transition-opacity">${categories[cat].length}</span>
                        <svg class="w-3 h-3 transition-transform group-open/section:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </div>
                `;
                
                const bookContainer = document.createElement('div');
                bookContainer.className = "space-y-2 pb-2 transition-all duration-300";

                categories[cat].forEach(book => {
                    const div = document.createElement('div');
                    div.className = "bg-white px-3 py-2.5 rounded-lg border border-gray-100 shadow-[0px_1px_2px_rgba(0,0,0,0.02)] hover:border-gray-300 hover:shadow-sm transition-all cursor-pointer group";
                    div.onclick = () => showDetail(book);
                    div.innerHTML = `<div class="flex justify-between items-center"><h4 class="text-[13px] font-medium text-gray-800 group-hover:text-black tracking-tight truncate w-full">${book.title}</h4></div><p class="text-[10px] text-gray-400 mt-0.5">${book.author}</p>`;
                    bookContainer.appendChild(div);
                });

                section.appendChild(summary);
                section.appendChild(bookContainer);
                list.appendChild(section);
            });
        }

        function setFilter(type) { renderLibrary(type); }
        function showDetail(book) {
            const detailView = document.getElementById('detail-view');
            document.getElementById('detail-title').innerText = book.title;
            document.getElementById('detail-author').innerText = book.author;
            document.getElementById('detail-category').innerText = book.category;
            document.getElementById('detail-summary').innerText = book.summary;
            document.getElementById('spotify-link').href = `https://open.spotify.com/search/${encodeURIComponent(book.title + " " + book.author)}`;
            const quoteList = document.getElementById('detail-quotes');
            quoteList.innerHTML = '';
            book.quotes.forEach(q => {
                const li = document.createElement('li');
                li.className = "text-sm text-gray-700 italic pl-3 border-l-2 border-gray-100 leading-relaxed";
                li.innerText = `“${cleanText(q)}”`; 
                quoteList.appendChild(li);
            });
            detailView.classList.add('detail-expanded');
            isTrayOpen = true; pauseTimer();
        }

        function toggleDetail(e) {
            const detailView = document.getElementById('detail-view');
            if (detailView.classList.contains('detail-expanded')) { detailView.classList.remove('detail-expanded'); isTrayOpen = false; resumeTimer(); }
            else { detailView.classList.add('detail-expanded'); isTrayOpen = true; pauseTimer(); }
        }

        function toggleAddModal() {
            const modal = document.getElementById('add-modal');
            if(modal.classList.contains('hidden')) { modal.classList.remove('hidden'); setTimeout(() => { modal.classList.remove('opacity-0'); modal.querySelector('div').classList.remove('scale-95'); }, 10); }
            else { modal.classList.add('opacity-0'); modal.querySelector('div').classList.add('scale-95'); setTimeout(() => modal.classList.add('hidden'), 200); }
        }

        document.getElementById('add-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const cat = document.getElementById('input-category').value;
            const newBook = {
                id: Date.now(),
                title: document.getElementById('input-title').value,
                author: document.getElementById('input-author').value,
                category: cat,
                summary: document.getElementById('input-summary').value,
                quotes: document.getElementById('input-quotes').value.split('\n').filter(line => line.trim() !== '')
            };
            library.unshift(newBook);
            saveState();
            if(activeFilterCategory === "All" || activeFilterCategory === cat) buildQuoteQueue();
            renderLibrary('all');
            toggleAddModal();
            e.target.reset();
        });

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
